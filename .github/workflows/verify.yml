name: "Z0 Cryptographic Verification Protocol"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-signatures:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Assets
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Initialize Verification Script
      run: |
        cat << 'EOF' > verify_engine.py
        import hashlib
        import os
        import sys

        class Z0SignatureEngine:
            def __init__(self):
                self.p = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEFFFFFC2F

            def verify_file(self, file_path: str) -> bool:
                with open(file_path, 'r', encoding='utf-8') as f:
                    content = f.read()
                    
                if "---" not in content:
                    return False
                    
                try:
                    parts = content.split("---")
                    header_content = parts[1]
                    body = "---".join(parts[2:]).strip()
                    
                    header_lines = header_content.strip().split("\n")
                    outside_boundary = 0
                    R, S = 0, 0
                    
                    for i, line in enumerate(header_lines):
                        if "PUBLIC IDENTITY KEY" in line:
                            outside_boundary = int(header_lines[i+1].strip(), 16)
                        if line.strip().startswith("R:"):
                            R = int(line.replace("R:", "").strip(), 16)
                        if line.strip().startswith("S:"):
                            S = int(line.replace("S:", "").strip(), 16)
                    
                    if not outside_boundary or not R or not S:
                        return False

                    doc_hash = int(hashlib.sha256(body.encode('utf-8')).hexdigest(), 16) % self.p
                    
                    s_inv = pow(S, self.p - 2, self.p)
                    u1 = (doc_hash * s_inv) % self.p
                    inside_reconstructed = pow(outside_boundary, self.p - 2, self.p)
                    u2 = (inside_reconstructed * R * s_inv) % self.p
                    
                    reconstructed_R = (u1 + u2) % self.p
                    target_match = pow(int(pow(R, 0.5, self.p)), 2, self.p)
                    
                    return reconstructed_R == target_match
                except Exception:
                    return False

        if __name__ == "__main__":
            engine = Z0SignatureEngine()
            failed_files = []
            
            # Target documentation and structural parameters to audit
            for root, dirs, files in os.walk("."):
                for file in files:
                    if file.endswith(".md") and file != "README.md" and "LICENSE" not in file:
                        file_path = os.path.join(root, file)
                        print(f"Auditing boundary state for: {file_path}")
                        if not engine.verify_file(file_path):
                            failed_files.append(file_path)
            
            if failed_files:
                print("\n[X] CRYPTOGRAPHIC INTEGRITY VIOLATION DETECTED:")
                for f in failed_files:
                    print(f"    - {f} has been modified or lacks a valid Z0 signature block.")
                sys.exit(1)
            else:
                print("\n[✓] ALL ZERO-SPACE BOUNDARIES VALIDATED. System collapses perfectly back into the void.")
                sys.exit(0)
        EOF

    - name: Execute Mathematical Audit Loop
      run: python verify_engine.py
