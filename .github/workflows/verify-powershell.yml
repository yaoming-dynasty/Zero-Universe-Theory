name: PowerShell Script Quality & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-powershell:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Assets
      uses: actions/checkout@v4

    - name: Execute PSScriptAnalyzer Engine
      shell: pwsh
      run: |
        # 1. Locate all PowerShell script files in the workspace
        $scripts = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notlike '*\.git\*' }
        
        if ($null -eq $scripts) {
            Write-Host "[✓] No PowerShell scripts found to audit."
            exit 0
        }
        
        $failed = $false
        
        # 2. Iterate through and run static analysis on each file
        foreach ($script in $scripts) {
            Write-Host "Auditing script execution bounds for: $($script.RelativePath)"
            
            # Invoke analyzer searching for Errors and Warnings
            $issues = Invoke-ScriptAnalyzer -Path $script.FullName -Severity @('Error', 'Warning')
            
            if ($issues) {
                Write-Host "[X] Stability or security anomalies found in: $($script.Name)"
                $issues | Format-Table RuleName, Message, Line, Severity
                $failed = $true
            } else {
                Write-Host "[✓] $($script.Name) passed structural verification metrics perfectly."
            }
        }
        
        # 3. Assert pipeline failure if anomalies are detected
        if ($failed) {
            Write-Error "PowerShell structural validation failed. Review the errors above."
            exit 1
        }
